    Bx: [ 150.0,  150.0, 150.0,   30.0,  30.0,  30.0] # 阻尼设为刚度的平方根附近，抑制晃动
    
    # Kn 和 Bn 必须是 7 个数：对应 7 个关节的零空间（冗余自由度）控制
