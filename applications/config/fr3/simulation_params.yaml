#     R_weight: 0.01           
    
#     # --- 2. 力控参数 (Z方向) ---
#     F_des_z: 5.0            # 期望接触力 (N)，根据实际需求设置正负
#     F_max_z: 10.0            # 最大安全力限制 (N)
#     Kp_f: 0.0                # 力外环 P (建议先设为0，只用优化器调整)
#     Ki_f: 0.0                # 力外环 I (建议先设为0)
    
