CartesianTrajImpPDController:
  ros__parameters:
    cmd_name: "torque"
     # Kx 和 Bx 必须是 6 个数：前 3 个是姿态 (旋转)，后 3 个是位置 (平移)
    Kx: [10.0, 10.0, 10.0, 100.0, 100.0, 100.0] # 姿态刚度设为 100，位置刚度设为 200
    Bx: [10.0, 10.0, 10.0, 10.0, 10.0, 10.0] # 阻尼设为刚度的平方根附近，抑制晃动
    
    # Kn 和 Bn 必须是 7 个数：对应 7 个关节的零空间（冗余自由度）控制
    Kn: [10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0] # 零空间刚度要比末端刚度软
    Bn: [6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0] # 基础阻尼，防止关节乱甩

# VariableImpedanceController:
