control_node:
  ros__parameters:
    update_rate: 1000
    lock_memory: true
    simulation: false
    sim_real_time: true
    publish_joint_state: true
    robot: hardwares::SimulationRobot
    parameters: "parameters.yaml"
    controllers: 
      # - controllers::JointMotionController
      - controllers::CartesianMotionController
      - controllers::CartesianTrajectoryController
      # - controllers::CartesianTrajectoryDianaController
      # - controllers::ForwardController
      # - controllers::RealtimeTestController
      # - controllers::ForceDragController
      # - controllers::RobotStateBroadcaster
      # - controllers::CartesianImpedancePDController
      - controllers::CartesianTrajImpPDController
      # - controllers::JointMotionControllerDiana
      # - controllers::VariableImpedanceController
    default_controller: ""

SimulationRobot:
  ros__parameters:
    end_effector: ""
    joint_command_interface:
      - position
      - velocity
      - torque
    joint_state_interface:
      - position
      - velocity
      - torque
    init_joint_pose: 
    # [.0, -0.962, 1.730, -3.842, -1.843, 0.0]
     [0.2, -0.2, 0.25, -2.5, 0.0, 2.3, 0.4]
    #  [.0, -0.962, 1.730, -3.842, -1.843, 0.0] #[.0, -0.962, 1.730, -3.842, -1.843, 0.0]# 
    # [0.0, -0.5, 0.1, 2.0, 0.0, -1.5, .0] 
    command_interface: [mode, pose]
    command_length: [2, 6]
    command_type: [int, double]
    state_interface: [T, c, g, external_torque, success, m, pose, position, velocity, torque, pose_q_]
    state_length: [16, 7, 7, 7, 1, 49, 6, 7, 7, 7, 6]
    state_type: [double, double, double, double, double, double, double, double, double, double, double]
    # sensors:
    sensors: [ft_sensor]
    ft_sensor: hardwares::FTATISensor

ft_sensor:
  ros__parameters:
    sensor_ip: 192.168.124.10
    state_interface: [force]
    state_length: [6]   
    # sensors: [ft_sensor]
    # ft_sensor: hardwares::FTDummySensor

